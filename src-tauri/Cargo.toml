[package]
name = "codevoice"
version = "0.1.0"
description = "CodeVoice — transforma fala em prompts técnicos estruturados para o Claude Code"
authors = ["Jorge Braga"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codevoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-log = "2.9.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-shell = "2.3.5"
regex = "1.13.1"
once_cell = "1.21.4"
log = "0.4.33"
rusqlite = { version = "0.40.1", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
thiserror = "2.0.19"
specta-typescript = "0.0.12"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc", features = ["typescript"], default-features = false }
dunce = "1.0.5"

# Só usado em `projects::scanner` para detectar NTFS hardlinks (`GetFileInformationByHandle` /
# `nNumberOfLinks`) — `std::os::windows::fs::MetadataExt::number_of_links` continua atrás da
# feature instável `windows_by_handle` nesta toolchain estável. Já é uma dependência transitiva
# profunda (via tauri/rusqlite/etc.), então isso não adiciona uma nova árvore de supply-chain.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"

